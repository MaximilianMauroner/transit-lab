[workspace]
resolver = "2"
members = [
    "crates/transit-domain",
    "crates/gtfs-source",
    "crates/gtfs-ingest",
    "crates/transit-spatial",
    "crates/gtfs-compile",
    "crates/transit-graph",
    "crates/transit-router",
    "crates/transit-labels",
    "crates/transit-dataset",
    "crates/transit-model",
    "crates/transit-search",
    "crates/transit-training",
    "crates/transit-inference",
    "crates/transit-server",
    "crates/transit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
half = "2.6"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.23"
zip = "4.3"
